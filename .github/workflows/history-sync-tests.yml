name: History sync backend and Android
on:
  push:
    paths: ['firebase/**', 'firebase.json', 'mobile-android/**', 'tv/**', '.github/workflows/history-sync-tests.yml']
  pull_request:
    paths: ['firebase/**', 'firebase.json', 'mobile-android/**', 'tv/**', '.github/workflows/history-sync-tests.yml']
permissions:
  contents: read
jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: firebase
      - run: npm test
        working-directory: firebase
  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [mobile-android, tv]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and compile release
        working-directory: ${{ matrix.platform }}
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          bash gradlew --no-daemon '-Pkotlin.compiler.execution.strategy=in-process' testDebugUnitTest assembleRelease
      - name: Preserve unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-unit-tests-${{ matrix.platform }}
          path: ${{ matrix.platform }}/app/build/test-results/testDebugUnitTest/*.xml
