name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-ipa:
    name: Build & Package KhoPhim.ipa
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Compile and Package IPA
        run: |
          mkdir -p build_ipa/Payload/KhoPhim.app
          
          # Copy Info.plist
          cp mobile-ios/KhoPhim/Resources/Info.plist build_ipa/Payload/KhoPhim.app/
          
          # Compile Swift code into native iOS arm64 binary
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            mobile-ios/KhoPhim/Sources/*.swift \
            -emit-executable \
            -o build_ipa/Payload/KhoPhim.app/KhoPhim \
            -framework SwiftUI \
            -framework AVKit \
            -framework AVFoundation \
            -framework UIKit
            
          # Ad-hoc code sign for sideloading
          codesign --force --deep --sign - build_ipa/Payload/KhoPhim.app || true
          
          # Package into .ipa
          cd build_ipa
          zip -r KhoPhim.ipa Payload
          mv KhoPhim.ipa ../KhoPhim.ipa
          cd ..

      - name: Upload IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: KhoPhim.ipa
