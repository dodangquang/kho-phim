name: Validate and build iOS

on:
  push:
    branches: [main, fix/mobile-safari-playback]
    paths: ['mobile-ios/**', '.github/workflows/build-ipa.yml']
  pull_request:
    paths: ['mobile-ios/**', '.github/workflows/build-ipa.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-ipa:
    name: Build & Package KhoPhim.ipa
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test playback and URL policy
        run: swift test --package-path mobile-ios

      - name: Compile and Package IPA
        run: |
          mkdir -p build_ipa/Payload/KhoPhim.app
          
          # Copy Info.plist
          cp mobile-ios/KhoPhim/Resources/Info.plist build_ipa/Payload/KhoPhim.app/
          
          # Compile Swift code into native iOS arm64 binary
          xcrun --sdk iphoneos swiftc \
            -swift-version 5 -parse-as-library -module-name KhoPhim \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -target arm64-apple-ios16.0 \
            mobile-ios/KhoPhim/Sources/*.swift \
            -emit-executable \
            -o build_ipa/Payload/KhoPhim.app/KhoPhim \
            -framework SwiftUI \
            -framework AVKit \
            -framework AVFoundation \
            -framework UIKit
            
          # Ad-hoc code sign for sideloading
          codesign --force --deep --sign - build_ipa/Payload/KhoPhim.app
          
          # Package into .ipa
          cd build_ipa
          zip -r KhoPhim.ipa Payload
          mv KhoPhim.ipa ../KhoPhim.ipa
          cd ..

      - name: Save IPA for device validation
        uses: actions/upload-artifact@v4
        with:
          name: KhoPhim-iOS
          path: KhoPhim.ipa
